# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# VAmPI, the vulnerable API (by erev0s) as an Isoloom spec: the upstream source, vendored unchanged
# in app/, built by its own Dockerfile (the vulnerable configuration).
# `isoloom generate`, then `isoloom up docker`.
version: 1
name: vampi

networks:
  lab: { cidr: 10.60.7.0/24, internet: false }

machines:
  vampi:
    networks: { lab: 10 }
    services: [{ port: 5000, name: api, http: true, publish: 5002 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: VAmPI answers
    http: http://vampi:5000/
    wait: 120
  - name: the Swagger UI is served
    http: http://vampi:5000/ui/
  - name: the debug endpoint leaks the users and their passwords
    script: checks/debug-endpoint.sh
    wait: 30

message: |
  VAmPI answers at http://localhost:{{ machines.vampi.services.0.publish }}/ and documents its API at
  /ui/. Call /createdb first to populate the database. Tokens expire after 60 seconds.
